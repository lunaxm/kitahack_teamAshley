version: '3.8'

services:
  # Backend Service
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - WATCHFILES_FORCE_POLLING=true

  # Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true  # Some versions of Webpack/CRA need this instead
      - WDS_SOCKET_PORT=0       # Prevents HMR websocket errors
    stdin_open: true
    tty: true
    depends_on:
      - backend
