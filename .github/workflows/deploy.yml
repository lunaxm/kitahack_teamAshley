name: Build and Push MedGemma API

on:
  push:
    branches: [ main ]  # Automation triggers on every push to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend  # Points to your backend folder
          push: true
          tags: lunaxm/medgemma-api:latest  # Updates your current v11 image
          build-args: |
            MONGO_URI=${{ secrets.MONGO_URL }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}